name: Nix checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting, lint, and NixOS evaluation
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Evaluate macOS configuration
        run: nix eval --no-update-lock-file --raw .#darwinConfigurations.darwin.system.drvPath
